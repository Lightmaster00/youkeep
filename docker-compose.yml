services:
  youkeep:
    # Option A: pull the prebuilt image published by GitHub Actions
    image: ghcr.io/lightmaster00/youkeep:latest
    # Option B: build locally instead (comment the line above, uncomment below)
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: youkeep
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Database + settings (e.g. /mnt/user/appdata/youkeep on Unraid)
      - ./data:/app/data
      # One mount per media type, so each can live on its own share
      # (e.g. /mnt/user/media/... on Unraid). Without these mounts, media ends
      # up inside ./data/downloads.
      - ./downloads/videos:/downloads/videos
      - ./downloads/music:/downloads/music
      - ./downloads/podcasts:/downloads/podcasts
    environment:
      - PUID=99   # Unraid "nobody"
      - PGID=100  # Unraid "users"
      - TZ=Europe/Paris  # download schedules run in this timezone
      - UMASK=022
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      # Behind a reverse proxy (NPM, Traefik, Caddy, Cloudflare Tunnel...) set
      # the number of proxies in front of YouKeep, usually 1. Leave it unset
      # when the app is reached directly: X-Forwarded-For/-Proto/-Host are
      # then ignored (clients could forge them).
      # - TRUST_PROXY=1
      # Cookies are Secure only when the request arrives over HTTPS (direct or
      # via X-Forwarded-Proto from a trusted proxy). Force with
      # COOKIE_SECURE=true|false if needed.
